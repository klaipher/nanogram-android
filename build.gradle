// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'com.google.gms:google-services:4.6.0'
        classpath 'com.huawei.agconnect:agcp:1.9.6.300'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        classpath 'androidx.baselineprofile:androidx.baselineprofile.gradle.plugin:1.5.0'
    }
}
repositories {
    google()
}

// Nanogram: arm64-v8a only by default (like Apple-Silicon-only on the Mac); -PnanogramAbis=all builds every ABI.
// Toolchain pins shared with Tools/dev/ng (Tools/dev/toolchain.properties is the single source).
def nanogramToolchain = new Properties()
file('Tools/dev/toolchain.properties').withInputStream { nanogramToolchain.load(it) }
ext.nanogramCompileSdk = nanogramToolchain.getProperty('compileSdk').tokenize('.')[0].toInteger()
ext.nanogramBuildTools = nanogramToolchain.getProperty('buildTools')
ext.nanogramNdk = nanogramToolchain.getProperty('ndk')
ext.nanogramCmake = nanogramToolchain.getProperty('cmake')
ext.nanogramAbiFilters = (findProperty('nanogramAbis') ?: 'arm64') == 'all' ?
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'] : ['arm64-v8a']

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new groovy.xml.XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}