include ':TMessagesProj'
include ':TMessagesProj_App'
// Nanogram ships TMessagesProj_App only. Upstream's Huawei/HockeyApp/Standalone/Tests apps stay in the tree but are not included: they keep minSdk 23/26 and cannot build against the minSdk 31 library.
// Profile generator: only when generating (Tools/dev/ng profile), so normal builds do not configure it.
if (providers.gradleProperty('nanogram.baselineProfile').getOrElse('false').toBoolean()) {
    include ':baselineprofile'
}
include ':jlatexmath'
project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
// Nanogram: only the 11 androidx/media modules the app uses (upstream includes all 40 through core_settings.gradle).
gradle.ext.androidxMediaSettingsDir = file('TMessagesProj_Modules/media').canonicalPath
[
    'lib-common': 'common', 'lib-container': 'container', 'lib-database': 'database',
    'lib-datasource': 'datasource', 'lib-decoder': 'decoder', 'lib-extractor': 'extractor',
    'lib-exoplayer': 'exoplayer', 'lib-exoplayer-dash': 'exoplayer_dash', 'lib-exoplayer-hls': 'exoplayer_hls',
    'lib-decoder-ffmpeg': 'decoder_ffmpeg', 'lib-session': 'session',
].each { name, dir ->
    def path = ':' + gradle.ext.androidxMediaModulePrefix + name
    include path
    project(path).projectDir = file("TMessagesProj_Modules/media/libraries/${dir}")
}