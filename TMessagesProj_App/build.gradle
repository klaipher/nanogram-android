apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
apply plugin: 'androidx.baselineprofile'

repositories {
    mavenCentral()
    google()
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
    // Installs the profile shipped in the APK (assets/dexopt) on first launch: sideloaded apps get no Play cloud profile.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    if (rootProject.findProject(':baselineprofile') != null) {
        baselineProfile project(':baselineprofile')
    }
}

baselineProfile {
    // Generated profiles are committed (src/main/generated/baselineProfiles); Tools/dev/ng profile regenerates them.
    mergeIntoMain = true
    saveInSrc = true
    automaticGenerationDuringBuild = false
    dexLayoutOptimization = true
}

android {
    compileSdk rootProject.ext.nanogramCompileSdk
    buildToolsVersion rootProject.ext.nanogramBuildTools
    // The app strips native libraries with this NDK's llvm-strip.
    ndkVersion rootProject.ext.nanogramNdk

    defaultConfig.applicationId = APP_PACKAGE


    lint {
        disable += ['MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi']
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            // Our release key lives outside git (Tools/dev/ng signing init); without it, release builds use the debug key.
            def nanogramStore = findProperty('nanogramStoreFile')
            storeFile file(nanogramStore ?: "../TMessagesProj/config/release.keystore")
            storePassword nanogramStore ? findProperty('nanogramStorePassword') : RELEASE_STORE_PASSWORD
            keyAlias nanogramStore ? findProperty('nanogramKeyAlias') : RELEASE_KEY_ALIAS
            keyPassword nanogramStore ? findProperty('nanogramKeyPassword') : RELEASE_KEY_PASSWORD
            // v1 for Android 6, v2 for speed, v3 so the key can be rotated later.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    packaging {
        jniLibs {
            // Nanogram: native libraries stay uncompressed and page-aligned and load straight from the APK:
            // no second extracted copy on the device and faster first start, at the cost of a larger APK download.
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    // Build types the baselineprofile plugin adds (nonMinifiedRelease, benchmarkRelease) are release builds and need
    // release's manifest (the afat flavor sets release to the SDK23 file).
    sourceSets.configureEach { sourceSet ->
        if (sourceSet.name == 'nonMinifiedRelease' || sourceSet.name == 'benchmarkRelease') {
            sourceSet.manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
        }
    }

    flavorDimensions = ["minApi"]

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters(*rootProject.ext.nanogramAbiFilters)
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters(*rootProject.ext.nanogramAbiFilters)
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionName APP_VERSION_NAME

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'
}

// Upstream's versionCode is APP_VERSION_CODE * 10 + ABI digit. Nanogram keeps the ABI digit (the app reads it) and
// replaces the base with minutes since 2020-01-01 UTC of our build number (YYYYMMDDHHMM), so every build updates
// the previous one while the marketing version follows upstream.
def nanogramAbiDigit = [afat: 9, bundleAfat: 1]
def nanogramBuildNumber = findProperty('nanogramBuildNumber')
def nanogramVersionBase = { ->
    if (nanogramBuildNumber == null) {
        return Integer.parseInt(APP_VERSION_CODE)
    }
    def t = java.time.LocalDateTime.parse(nanogramBuildNumber.toString(), java.time.format.DateTimeFormatter.ofPattern('yyyyMMddHHmm'))
    return (int) java.time.Duration.between(java.time.LocalDateTime.of(2020, 1, 1, 0, 0), t).toMinutes()
}

// -Pnanogram.baselineProfile=true (Tools/dev/ng profile): only the afat release family exists, so
// generateBaselineProfile builds and runs exactly one variant.
def nanogramProfileGeneration = providers.gradleProperty('nanogram.baselineProfile').getOrElse('false').toBoolean()
def nanogramProfileBuildTypes = ['release', 'nonMinifiedRelease', 'benchmarkRelease']

androidComponents {
    beforeVariants(selector().all()) { variant ->
        def flavor = variant.productFlavors.find { it.first == 'minApi' }?.second
        if (variant.buildType != 'release' && flavor != 'afat') {
            variant.enable = false
        }
        // The profile plugin also derives nonMinified/benchmark types from 'standalone'; only the Release ones are used.
        if (variant.buildType != null && variant.buildType.matches('(nonMinified|benchmark).+') && !variant.buildType.endsWith('Release')) {
            variant.enable = false
        }
        if (nanogramProfileGeneration && (flavor != 'afat' || !(variant.buildType in nanogramProfileBuildTypes))) {
            variant.enable = false
        }
    }
    onVariants(selector().all()) { variant ->
        def flavor = variant.productFlavors.find { it.first == 'minApi' }?.second
        def code = nanogramVersionBase() * 10 + (nanogramAbiDigit[flavor] ?: 9)
        variant.outputs.each { it.versionCode.set(code) }
    }
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
