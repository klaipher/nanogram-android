# Pinned toolchain for Nanogram for Android. `Tools/dev/ng setup` installs exactly these.
jdk=21
compileSdk=36
buildTools=36.0.0
ndk=27.2.12479018
cmake=3.22.1
# Native prebuilts (ffmpeg, BoringSSL, opus, vpx, dav1d, openh264, tlottie, wallet-engine, td, wamr)
prebuildApi=23
# arm64 = arm64-v8a only (default); all = arm64-v8a, armeabi-v7a, x86_64, x86
abis=arm64
ccache.maxsize=8G
